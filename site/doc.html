<!DOCTYPE html>
<html lang="en">
<head>

<title>Docs — STM32 Bluepill Emulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #070b14; --panel: #0d1526; --panel-2: #0a1120;
  --line: #1c2a44; --line-soft: #14203a;
  --txt: #dbe7f5; --dim: #8ba0bd; --faint: #54678a;
  --cyan: #22d3ee; --cyan-deep: #0e7490; --amber: #fbbf24;
  --mono: 'Cascadia Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--txt); line-height: 1.7;
  background:
    radial-gradient(1100px 480px at 12% -8%, rgba(34,211,238,0.10), transparent 60%),
    radial-gradient(900px 520px at 95% 110%, rgba(129,140,248,0.10), transparent 60%),
    var(--ink);
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(56,189,248,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.055) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 100%);
}
body > * { position: relative; z-index: 1; }
header { background: rgba(7,11,20,0.82); border-bottom: 1px solid var(--line-soft); padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
header h1 { font-size: 16px; font-weight: 800; background: linear-gradient(90deg, #67e8f9, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
header .sub { font-size: 11.5px; color: var(--faint); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .spacer { flex: 1; }
header a.nav { font-size: 11.5px; font-weight: 600; color: var(--dim); text-decoration: none; border: 1px solid var(--line); padding: 4px 13px; border-radius: 999px; background: rgba(13,21,38,0.6); transition: all 0.15s ease; }
header a.nav:hover, header a.nav.active { background: rgba(14,116,144,0.25); color: #a5f3fc; border-color: var(--cyan-deep); box-shadow: 0 0 10px rgba(34,211,238,0.25); }
main { max-width: 920px; margin: 0 auto; padding: 30px 24px 60px; }
main h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 4px; }
main h1 .anchor, .doc h2 .anchor, .doc h3 .anchor { display: none; }
main h2 { font-size: 11px; color: var(--faint); margin: 32px 0 14px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
.doc h2 { font-size: 20px; color: var(--txt); text-transform: none; letter-spacing: -0.2px; margin: 30px 0 10px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.doc h2:first-of-type { border-top: none; }
.doc h3 { font-size: 15.5px; color: #a5f3fc; margin: 22px 0 8px; }
.doc h4 { font-size: 13.5px; color: var(--dim); margin: 16px 0 6px; }
.doc h2:hover::after, .doc h3:hover::after { content: ' #'; color: var(--cyan-deep); font-weight: 400; }
.doc-src { font-size: 11.5px; color: var(--faint); margin-bottom: 18px; }
.doc-src a { color: var(--faint); }
p, li { font-size: 14.5px; color: var(--dim); }
strong { color: var(--txt); }
ul, ol { padding-left: 22px; } li { margin: 5px 0; }
li > ul, li > ol { margin-top: 4px; }
a { color: var(--cyan); text-decoration: none; } a:hover { color: #a5f3fc; text-decoration: underline; }
code { background: #02060f; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.88em; color: #7dd3fc; font-family: var(--mono); }
pre { background: #02060f; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 12px 0; font-size: 12.5px; line-height: 1.65; color: var(--dim); font-family: var(--mono); box-shadow: inset 0 2px 12px rgba(0,0,0,0.6); }
pre code { background: none; border: none; padding: 0; }
blockquote { border-left: 3px solid var(--cyan-deep); padding: 8px 16px; margin: 14px 0; color: var(--dim); background: rgba(14,116,144,0.10); border-radius: 0 10px 10px 0; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; display: block; overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
thead tr { background: rgba(13,21,38,0.7); }
tbody tr:hover { background: rgba(34,211,238,0.04); }
th { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
td { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }
td:first-child { color: #a5f3fc; }
hr { border: none; border-top: 1px solid var(--line-soft); margin: 26px 0; }
.toc { background: rgba(13,21,38,0.85); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; margin: 16px 0 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.toc b { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 2px; }
.toc ul { columns: 2; margin-top: 8px; }
.toc li { font-size: 13px; }
img { max-width: 100%; border-radius: 8px; }
.err { color: #f87171; }
footer { text-align: center; padding: 26px; color: var(--faint); font-size: 12px; border-top: 1px solid var(--line-soft); }
footer a { color: var(--cyan); }
@media (min-width: 1200px) {
  main { max-width: 1120px; }
  /* Real sidebar: TOC owns column 2, article flows in column 1 — never
     overlapping (float made code blocks squeeze / slide underneath). */
  #doc-body:has(> .toc) { display: grid; grid-template-columns: minmax(0, 1fr) 270px; column-gap: 26px; align-items: start; }
  #doc-body > .toc { grid-column: 2; grid-row: 1 / span 500; float: none; width: auto; margin: 6px 0 18px; position: sticky; top: 70px; align-self: start; }
  #doc-body > .toc ul { columns: 1; }
}
@media (max-width: 640px) {
  header { padding: 10px 14px; gap: 8px; }
  header .sub { display: none; }
  main { padding: 20px 14px 44px; }
  main h1 { font-size: 22px; }
  .doc h2 { font-size: 18px; }
  p, li { font-size: 13.5px; }
  .toc ul { columns: 1; }
  pre { font-size: 11.5px; padding: 12px; border-radius: 8px; }
  th, td { padding: 7px 8px; }
}
</style>
</head>
<body>
<header>
    <h1>&#x25C8; STM32 Bluepill Emulator</h1>
    <span class="sub" id="crumb">Docs</span>
    <span class="spacer"></span>
    <a class="nav" href="index.html">Demo</a>
    <a class="nav active" href="docs.html">Docs</a>
    <a class="nav" href="about.html">About</a>
    <a class="nav" href="https://github.com/danish9661/STM32F1-emulator" target="_blank" rel="noopener">GitHub</a>
</header>
<main>
<h1 id="doc-title">Docs</h1>
<div class="doc-src" id="doc-src"></div>
<div class="doc" id="doc-body"><p>Loading…</p></div>
</main>
<footer>
    STM32 Bluepill Emulator &middot; <a href="docs.html">Docs</a> &middot; <a href="index.html">Live Demo</a> &middot;
    <a href="https://github.com/danish9661/STM32F1-emulator" target="_blank" rel="noopener">Source</a>
</footer>
<script type="module">
const params = new URLSearchParams(location.search);
const file = params.get('f') || 'README.md';
const body = document.getElementById('doc-body');

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
    s = esc(s);
    s = s.replace(/\[!\[([^\]]*)\]\(([^)\s]+)\)\]\(([^)\s]+)\)/g, '<a href="$3"><img alt="$1" src="$2"></a>');
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
        if (/^(?:[a-z]+:)?\/\//i.test(u) || u.startsWith('#') || u.startsWith('mailto:')) return `<a href="${u}">${t}</a>`;
        const m = u.match(/^(?:\.\.\/|\.\/|docs\/)?([A-Za-z0-9_.-]+)\.md(#[^)]*)?$/);
        if (m) return `<a href="doc.html?f=${m[1]}.md${m[2] || ''}">${t}</a>`;
        return `<a href="${u}">${t}</a>`;
    });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
}
function slug(s) {
    return s.toLowerCase().replace(/`([^`]+)`/g, '$1').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function render(md) {
    const lines = md.replace(/\r\n?/g, '\n').split('\n');
    let html = '', i = 0, para = [];
    const tocs = [];
    const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
    const isTableDelim = (l) => /^\|?[\s:|-]+\|[\s:|-]*\|?$/.test(l) && l.includes('-');
    while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith('```')) {
            flushPara();
            const lang = line.slice(3).trim();
            i++;
            const buf = [];
            while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
            i++;
            html += `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ''}>${esc(buf.join('\n'))}</code></pre>`;
            continue;
        }
        const hm = line.match(/^(#{1,6})\s+(.*)$/);
        if (hm) {
            flushPara();
            const lvl = hm[1].length, id = slug(hm[2]);
            if (lvl === 2) tocs.push([id, hm[2]]);
            html += `<h${lvl} id="${id}">${inline(hm[2])}</h${lvl}>`;
            i++;
            continue;
        }
        if (/^---+$/.test(line.trim())) { flushPara(); html += '<hr>'; i++; continue; }
        if (line.startsWith('>')) {
            flushPara();
            const buf = [];
            while (i < lines.length && lines[i].startsWith('>')) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
            html += `<blockquote>${buf.map((l) => inline(l)).join('<br>')}</blockquote>`;
            continue;
        }
        if (/^\|.*\|$/.test(line.trim()) && i + 1 < lines.length && isTableDelim(lines[i + 1])) {
            flushPara();
            const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
            const head = cells(line), aligns = cells(lines[i + 1]).map((c) =>
                c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
            html += '<table><thead><tr>' + head.map((c, k) =>
                `<th${aligns[k] !== 'left' ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
            i += 2;
            while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
                html += '<tr>' + cells(lines[i]).map((c, k) =>
                    `<td${aligns[k] !== 'left' ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</td>`).join('') + '</tr>';
                i++;
            }
            html += '</tbody></table>';
            continue;
        }
        const ulm = line.match(/^(\s*)[-*]\s+(.*)$/);
        const olm = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
        if (ulm || olm) {
            flushPara();
            const tag = ulm ? 'ul' : 'ol';
            html += `<${tag}>`;
            while (i < lines.length) {
                const m2 = ulm ? lines[i].match(/^(\s*)[-*]\s+(.*)$/) : lines[i].match(/^(\s*)\d+[.)]\s+(.*)$/);
                if (!m2) break;
                html += `<li>${inline(m2[2])}</li>`;
                i++;
            }
            html += `</${tag}>`;
            continue;
        }
        if (!line.trim()) { flushPara(); i++; continue; }
        para.push(line.trim());
        i++;
    }
    flushPara();
    return { html, tocs };
}

try {
    if (!/^[A-Za-z0-9_.-]+\.md$/.test(file)) throw new Error('bad doc name');
    const res = await fetch('docs-src/' + file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const { html, tocs } = render(md);
    const m1 = md.match(/^#\s+(.*)$/m);
    const title = m1 ? m1[1].replace(/`/g, '') : file;
    // The markdown H1 becomes the page title — drop it from the body.
    const bodyHtml = html.replace(/^<h1 id="[^"]+">.*?<\/h1>/, '');
    document.title = title + ' — STM32 Bluepill Emulator Docs';
    // Per-variant discovery tags (Google executes JS): canonical + OG +
    // TechArticle schema so each ?f= doc is indexed on its own URL.
    const pageUrl = 'https://danish9661.github.io/STM32F1-emulator/doc.html?f=' + file;
    const setMeta = (attr, key, val) => {
        let el = document.head.querySelector(`meta[${attr}="${key}"]`);
        if (!el) { el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
        el.setAttribute('content', val);
    };
    let canon = document.head.querySelector('link[rel="canonical"]');
    if (!canon) { canon = document.createElement('link'); canon.setAttribute('rel', 'canonical'); document.head.appendChild(canon); }
    canon.setAttribute('href', pageUrl);
    setMeta('property', 'og:title', title + ' — STM32 Bluepill Emulator Docs');
    setMeta('property', 'og:url', pageUrl);
    setMeta('property', 'og:description', 'Rendered live from ' + file + ': ' + title);
    let ld = document.getElementById('doc-jsonld');
    if (!ld) { ld = document.createElement('script'); ld.id = 'doc-jsonld'; ld.type = 'application/ld+json'; document.head.appendChild(ld); }
    ld.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'TechArticle',
        headline: title, url: pageUrl, isPartOf: { '@type': 'WebSite', name: 'STM32 Bluepill Emulator' },
    });
    document.getElementById('doc-title').textContent = title;
    document.getElementById('crumb').textContent = 'Docs · ' + title;
    document.getElementById('doc-src').innerHTML =
        `Rendered live from <a href="https://github.com/danish9661/STM32F1-emulator/blob/master/${file.startsWith('README') || file.startsWith('CHANGELOG') ? '' : 'docs/'}${file}">${file}</a>`;
    body.innerHTML = (tocs.length >= 3
        ? `<div class="toc"><b>On this page</b><ul>${tocs.map(([id, t]) => `<li><a href="#${id}">${inline(t)}</a></li>`).join('')}</ul></div>`
        : '') + bodyHtml;
    if (location.hash) {
        const el = document.querySelector(location.hash);
        if (el) el.scrollIntoView();
    }
} catch (e) {
    body.innerHTML = `<p class="err">Could not load <code>${esc(file)}</code>: ${esc(e.message)}. See the <a href="docs.html">docs index</a>.</p>`;
}
</script>
</body>
</html>
