name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Install binaryen (pinned wasm-opt, must match local builds)
        run: |
          curl -sL -o /tmp/be.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          tar xzf /tmp/be.tar.gz -C /tmp
          echo "/tmp/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Install JS deps
        run: npm ci
      - name: Rust sanity check
        run: cargo check
      - name: Build peripheral WASM
        env:
          # Panic-location file paths ($CARGO_HOME/registry/src/... = /home/runner/...)
          # are baked into the data section; remap to a canonical prefix so the
          # artifact is machine-independent (local build must use the same flag:
          # RUSTFLAGS="--remap-path-prefix=$HOME=/build")
          RUSTFLAGS: "--remap-path-prefix=/home/runner=/build"
        run: |
          echo "=== toolchain diagnostics ==="
          rustc --version; cargo --version; wasm-pack --version
          echo "PATH=$PATH" | tr ':' '\n' | grep -n -E "binaryen|wasm" || true
          which wasm-opt && wasm-opt --version || echo "NO wasm-opt on PATH"
          ls -la /tmp/binaryen-version_132/bin/ 2>&1 | head -4
          find ~/.cache/.wasm-pack -name wasm-bindgen -o -name wasm-opt 2>/dev/null | while read f; do echo "== $f"; "$f" --version 2>&1 | head -1; done
          echo "=== building ==="
          wasm-pack build --target web 2>&1 | grep -E "found wasm-opt|Optimizing|wasm-opt" || true
          echo "=== post-build cache ==="
          find ~/.cache/.wasm-pack -name wasm-bindgen -o -name wasm-opt 2>/dev/null | while read f; do echo "== $f"; "$f" --version 2>&1 | head -1; done
      - name: site/ must mirror pkg/ (emulator.js + wasm glue + wasm code)
        run: |
          cmp pkg/emulator.js site/emulator.js
          cmp pkg/stm32_bluepill_wasm.js site/stm32_bluepill_wasm.js
          # wasm-pack downloads its own wasm-bindgen-cli; the version it picks
          # can differ between machines (CI fresh cache vs local cache), and
          # each version rewrites ABI metadata in the DATA section + trailing
          # custom sections — benign, functionally identical. The CODE section
          # is the artifact's real content: compare it byte-for-byte (catches
          # the 7040bd0 failure mode: missing/stale artifact of different
          # content). The two JS artifacts stay byte-exact.
          echo "wasm sizes: pkg=$(stat -c%s pkg/stm32_bluepill_wasm_bg.wasm) site=$(stat -c%s site/stm32_bluepill_wasm_bg.wasm)"
          md5sum pkg/stm32_bluepill_wasm_bg.wasm site/stm32_bluepill_wasm_bg.wasm
          python3 - <<'EOF'
          def sections(p):
              d = open(p, 'rb').read()
              i = 8
              out = []
              while i < len(d):
                  sid = d[i]; i += 1
                  sz = 0; sh = 0
                  while True:
                      b = d[i]; i += 1
                      sz |= (b & 0x7f) << sh; sh += 7
                      if not b & 0x80: break
                  out.append((sid, sz, i))
                  i += sz
              return d, out
          for name, path, out in (('pkg', 'pkg/stm32_bluepill_wasm_bg.wasm', '/tmp/pkg.code'),
                                  ('site', 'site/stm32_bluepill_wasm_bg.wasm', '/tmp/site.code')):
              d, secs = sections(path)
              code = next((sz, o) for (sid, sz, o) in secs if sid == 10)
              payload = d[code[1]:code[1] + code[0]]
              open(out, 'wb').write(payload)
              print(f'{name} code section: {len(payload)} bytes')
              customs = [d[o:o + sz] for (sid, sz, o) in secs if sid == 0]
              print(f'{name} custom sections:')
              for c in customs:
                  print('   ', c[:200])
              print(f'{name} code head b64: {payload[:256].hex()}')
              datas = [d[o:o + sz] for (sid, sz, o) in secs if sid == 11]
              print(f'{name} data strings:')
              for dd in datas:
                  import re
                  for s in re.findall(rb'[\x20-\x7e]{4,}', dd):
                      print('   ', s[:120])
          EOF
          echo "comparing code sections:"
          cmp /tmp/pkg.code /tmp/site.code
          echo "code sections identical"
      - name: Prepare firmware ELF + device images (committed copies live in site/)
        run: |
          cp site/arduino_periph_test.elf tests/arduino_periph_test/build/arduino_periph_test.ino.elf
          cp site/arduino_eeprom.bin tests/arduino_periph_test/build/eeprom.bin
          cp site/arduino_eeprom2.bin tests/arduino_periph_test/build/eeprom2.bin
          cp site/arduino_spi_flash.bin tests/arduino_periph_test/build/spi_flash.bin
          cp site/arduino_spi_flash2.bin tests/arduino_periph_test/build/spi_flash2.bin
          mkdir -p tests/arduino_coremark/build
          cp site/arduino_coremark.elf tests/arduino_coremark/build/arduino_coremark.ino.elf
          mkdir -p tests/arduino_echo/build
          cp site/arduino_echo.elf tests/arduino_echo/build/arduino_echo.ino.elf
      - name: Unit tests
        run: node tests/test_all.mjs
      - name: CPU decoder census (16-bit + 32-bit gates)
        run: |
          pip install capstone==5.0.9
          cargo test --release --lib cpu::census
          python3 tests/census_16.py
          python3 tests/census_32.py
      - name: Differential fuzz canary (200 cases vs Unicorn oracle)
        run: |
          pip install unicorn==2.1.4 capstone==5.0.9
          python3 tests/fuzz_diff.py --cases 200 --seed 1
          python3 tests/fuzz_diff.py --cases 200 --seed 4
      - name: Spec vectors (CRC anchors + CAN filter differential)
        run: node tests/test_spec_vectors.mjs
      - name: DFU bootloader (AN3155 session)
        run: node tests/test_bootloader.mjs
      - name: Board hardware (NRST/BOOT0/boardInfo in WASM)
        run: node tests/test_board_buttons.mjs
      - name: Firmware format + ESM smoke tests
        run: |
          node tests/test_firmware_formats.mjs
          node tests/test_esm.mjs
      - name: Regression canary (39/39 firmware checks)
        run: node tests/canary.mjs
      - name: Full firmware run (200M instructions, UART RX + config)
        run: echo -n "AB" | node pkg/cli.mjs --config=tests/arduino_periph_test/config.yaml --max=200000000
      - name: Emulator.js path (browser run loop) 200M firmware run
        run: node tests/test_emulator_js.mjs
      - name: Bus-tap feed (7-seg latch + WS2812 strip decode)
        run: node tests/test_bus_tap.mjs
      - name: WebSocket bridge (headless server + WS client round-trip)
        run: node tests/test_ws_bridge.mjs
      - name: WS2812 strip (SPI1 + DMA1 CH3) regression
        run: node tests/test_ws2812.mjs
      - name: RTC clock demo (counter + HH:MM:SS prints)
        run: node tests/test_rtc_clock.mjs
      - name: Servo sweep demo (TIM3 PWM + angle prints)
        run: node tests/test_servo.mjs
      - name: DAC sine + ADC loopback demo
        run: node tests/test_dac_sine.mjs
      - name: I2C scanner demo (Wire ACK/NACK)
        run: node tests/test_i2c_scan.mjs
      - name: CAN loopback chat demo
        run: node tests/test_can_chat.mjs
      - name: Stopwatch demo (EXTI button + TIM2)
        run: node tests/test_stopwatch.mjs
      - name: PWM wave demo (TIM DMA-burst duty steps)
        run: node tests/test_pwm_wave.mjs
      - name: I2C slave demo (host-driven RX/TX)
        run: node tests/test_i2c_slave.mjs
      - name: Mini-RTOS demo (PendSV preemptive tasks)
        run: node tests/test_mini_rtos.mjs
      - name: SD data-logger demo (SDIO + ADC + RTC)
        run: node tests/test_sd_logger.mjs
      - name: USB CDC serial demo (EP0 control + EP1 bulk echo)
        run: node tests/test_usb_cdc.mjs
      - name: USB real-stack serial (STM32duino enumerate + echo)
        run: node tests/test_usb_serial.mjs
      - name: USB OTG FS device (F105 registers + FIFO + IRQs)
        run: node tests/test_otg.mjs
      - name: USB OTG CDC demo (F105 enumerate + echo, real machine code)
        run: node tests/test_otg_cdc.mjs
      - name: USB OTG host demo (F105 HCD enumerate + bulk echo, real machine code)
        run: node tests/test_otg_host.mjs
      - name: USB DFU bootloader demo (Maple DNLOAD + manifest, real machine code)
        run: node tests/test_dfu.mjs
      - name: CoreMark CPU-semantics check (known-answer CRCs)
        run: node tests/test_coremark.mjs
      - name: Chip variants (DBGMCU IDCODE per chip + GD32 boot)
        run: node tests/test_chips.mjs
      - name: GDB stub (RSP protocol over TCP)
        run: node tests/test_gdbstub.mjs
      - name: Per-board demo firmware (4 targets x chips)
        run: node tests/test_board_demo.mjs
      - name: Per-board UART echo (native Serial per target)
        run: node tests/test_board_echo.mjs
      - name: Per-board showcase (7 peripherals per target)
        run: node tests/test_board_showcase.mjs
      - name: Per-board RTC clock (per target)
        run: node tests/test_board_rtc.mjs
      - name: High-density desk (FSMC + DAC on F103RC)
        run: node tests/test_hd_fsmc.mjs
      - name: Install Chromium for Playwright (before first headed use)
        run: npx playwright install chromium --with-deps
      - name: Site pages (docs + demo smoke, headed Chromium)
        run: npx playwright test tests/test_browser_site.mjs --reporter=list --timeout=300000
      - name: Docs sync freshness (site/docs-src mirrors repo markdown)
        run: node site/sync-docs.mjs && git diff --exit-code -- site/docs-src site/docs.json
      - name: Dual-CAN demo (CAN1+CAN2 on F105 SVD map)
        run: node tests/test_can_dual.mjs
      - name: STM32F1 wrapper API (ergonomic class over emulator.js)
        run: node tests/test_stm32f1_api.mjs
      - name: STM32F1 GPIO/transfer ordering (per-batch event interleave)
        run: node tests/test_stm32f1_ordering.mjs
      - name: I2C/SPI/USART virtual-peripheral event queue
        run: node tests/test_i2c_events.mjs
      - name: TIM/ADC virtual-peripheral events (extended queue)
        run: node tests/test_extra_events.mjs
      - name: EXTI edge virtual-peripheral events (extended queue)
        run: node tests/test_exti_events.mjs
      - name: DAC/CRC/RTC/CAN virtual-peripheral events (extended queue)
        run: node tests/test_more_events.mjs
      - name: TIM input-capture event (extended queue)
        run: node tests/test_tim_capture.mjs
      - name: FSMC transaction event (extended queue)
        run: node tests/test_fsmc_events.mjs
      - name: TIM input-capture AFIO remap
        run: node tests/test_tim_remap.mjs
      - name: FSMC-backed virtual display (Wokwi-style peripheral)
        run: node tests/test_fsmc_display.mjs
      - name: I2C BUSY flag lifecycle (START/STOP/NACK)
        run: node tests/test_i2c_busy.mjs
      - name: DMA request register bits (DAC/TIM/SPI/USART)
        run: node tests/test_dma_requests.mjs
      - name: DMA signal generation + TIM slave mode + I2C clock stretching
        run: node tests/test_dma_signals.mjs
      - name: TIM edge-triggered slave mode, DMA2, I2C CR2 DMAEN
        run: node tests/test_slave_pwm_dma2.mjs
      - name: Browser firmware tests (Playwright + Chromium)
        run: |
          npx playwright install chromium --with-deps
          npx playwright test tests/test_browser.mjs --reporter=list --timeout=300000
      - name: Browser demo presets (all page presets live)
        run: npx playwright test tests/test_browser_demos.mjs --reporter=list --timeout=300000
      - name: Browser board presets (chip + ELF matrix)
        run: npx playwright test tests/test_browser_boards.mjs --reporter=list --timeout=300000
      - name: Browser bus-tap decode (7-seg write-tap path)
        run: npx playwright test tests/test_browser_segdecode.mjs --reporter=list --timeout=300000
